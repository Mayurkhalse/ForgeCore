- id: ML-REP-001
  title: Seed all random number generators for reproducible ML runs
  layer: python-ml
  category: data
  severity: high
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, refactor, new-project]
  rule: >
    Explicitly set seeds for standard library `random`, `numpy.random`, and deep learning frameworks
    (`torch.manual_seed`, `torch.cuda.manual_seed_all`, `tf.random.set_seed`).
  rationale: >
    Unseeded random initialization causes non-reproducible experiments and untraceable regressions.
  good: |
    def seed_everything(seed=42):
        random.seed(seed)
        np.random.seed(seed)
        torch.manual_seed(seed)
        torch.cuda.manual_seed_all(seed)
  bad: |
    # Running training with default random initialization
    model = create_model()
  verify:
    type: checklist
    prompt: Confirm random seeds are set across all ML libraries.
  tags: [ml, reproducibility]
  since: "0.1.0"

- id: ML-DATA-001
  title: Prevent data leakage by fitting feature scalers strictly on training data
  layer: python-ml
  category: data
  severity: critical
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, bugfix, refactor]
  rule: >
    Fit scalers, encoders, and imputation transformers solely on the training dataset.
    Apply only `.transform()` to validation and test datasets.
  rationale: >
    Fitting on the full dataset leaks information from validation/test sets, resulting in overly optimistic evaluation.
  good: |
    scaler.fit(X_train)
    X_train_scaled = scaler.transform(X_train)
    X_test_scaled = scaler.transform(X_test)
  bad: |
    X_scaled = scaler.fit_transform(X) # fits across entire dataset prior to split!
    X_train, X_test = train_test_split(X_scaled)
  verify:
    type: checklist
    prompt: Verify data transformers are fitted exclusively on training splits.
  tags: [ml, data-leakage, preprocessing]
  since: "0.1.0"

- id: ML-SEC-001
  title: Restrict PyTorch model loading to weights_only
  layer: python-ml
  category: security
  severity: critical
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, bugfix, refactor]
  rule: >
    When loading models via `torch.load()`, specify `weights_only=True` to prevent arbitrary code execution via pickle.
  rationale: >
    Untrusted `.pt` or `.pkl` checkpoints can execute arbitrary shell commands during deserialization.
  good: |
    checkpoint = torch.load("model.pt", weights_only=True)
  bad: |
    checkpoint = torch.load("model.pt") # allows arbitrary code execution in untrusted checkpoints
  verify:
    type: ruff
  tags: [ml, security, pickle, pytorch]
  since: "0.1.0"

- id: ML-MEM-001
  title: Disable gradient calculation and free memory during model inference
  layer: python-ml
  category: perf
  severity: high
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, refactor]
  rule: >
    Wrap evaluation and inference loops in `with torch.no_grad():` or use `@torch.inference_mode()`.
  rationale: >
    Tracking gradients during inference consumes massive GPU VRAM and causes Out-Of-Memory (OOM) crashes.
  good: |
    @torch.inference_mode()
    def predict(model, inputs):
        return model(inputs)
  bad: |
    def predict(model, inputs):
        return model(inputs) # tracks computation graph unnecessarily
  verify:
    type: checklist
    prompt: Confirm inference code runs inside torch.no_grad() or @torch.inference_mode().
  tags: [ml, pytorch, memory, performance]
  since: "0.1.0"

- id: ML-PIPE-001
  title: Encapsulate preprocessing and modeling in formal pipelines
  layer: python-ml
  category: architecture
  severity: high
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, new-project]
  rule: >
    Chain preprocessing transforms and estimators inside `sklearn.pipeline.Pipeline` or specialized frameworks.
  rationale: >
    Pipelines guarantee identical feature transformations are executed during both training and production serving.
  good: |
    pipe = Pipeline([('imputer', SimpleImputer()), ('scaler', StandardScaler()), ('clf', LogisticRegression())])
  bad: |
    # 20 loose functions transforming data manually in notebook cells
  verify:
    type: checklist
    prompt: Confirm preprocessing and estimation steps are encapsulated in formal pipelines.
  tags: [ml, pipelines, architecture]
  since: "0.1.0"

- id: ML-EVAL-001
  title: Evaluate performance against a strictly held-out test split
  layer: python-ml
  category: testing
  severity: critical
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, testing]
  rule: >
    Maintain distinct training, validation (for tuning), and holdout test datasets.
    Never report training loss as the final model capability score.
  rationale: >
    Models can overfit training data completely while having zero generalization power on unseen inputs.
  good: |
    test_score = model.score(X_test, y_test)
  bad: |
    train_score = model.score(X_train, y_train) # reporting training score as metric
  verify:
    type: checklist
    prompt: Confirm model evaluation metrics are reported against independent holdout test data.
  tags: [ml, evaluation, testing]
  since: "0.1.0"

- id: ML-LOG-001
  title: Track experiments and hyperparameters with an experiment tracker
  layer: python-ml
  category: ops
  severity: medium
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, new-project]
  rule: >
    Log hyperparameters, metrics, and artifact checkpoints using an experiment tracker (e.g. MLflow, Wandb, TensorBoard).
  rationale: >
    Untracked runs make it impossible to reproduce results or compare model architectures systematically.
  good: |
    mlflow.log_params({"lr": 0.001, "batch_size": 32})
    mlflow.log_metric("val_loss", loss)
  bad: |
    print(f"Epoch {epoch}: loss={loss}")
  verify:
    type: checklist
    prompt: Confirm metrics and parameters are logged with an experiment tracker.
  tags: [ml, tracking, mlflow]
  since: "0.1.0"

- id: ML-CHK-001
  title: Implement checkpointing and early stopping during training
  layer: python-ml
  category: ops
  severity: high
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, refactor]
  rule: >
    Save best model weights based on validation loss and halt training if validation metric stops improving.
  rationale: >
    Prevents overfitting and protects training progress from machine crashes or spot instance terminations.
  good: |
    early_stop = EarlyStopping(monitor="val_loss", patience=5)
  bad: |
    # Running 1000 epochs with no validation monitoring or checkpoint saving
  verify:
    type: checklist
    prompt: Verify training scripts implement checkpointing and early stopping.
  tags: [ml, training, checkpointing]
  since: "0.1.0"

- id: ML-TYPE-001
  title: Validate tensor shapes and dtypes at model input/output boundaries
  layer: python-ml
  category: architecture
  severity: medium
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, bugfix]
  rule: >
    Assert expected tensor shapes and channel dimensions in dataset getters and forward methods.
  rationale: >
    Silent broadcasting mismatches generate incorrect calculations without raising runtime errors.
  good: |
    assert x.shape[1:] == (3, 224, 224), f"Expected (3, 224, 224) but got {x.shape[1:]}"
  bad: |
    # Blindly passing tensors through network
  verify:
    type: checklist
    prompt: Confirm tensor shapes and dimensions are validated.
  tags: [ml, tensors, validation]
  since: "0.1.0"

- id: ML-MOD-001
  title: Save model artifacts with explicit signature and environment specification
  layer: python-ml
  category: ops
  severity: medium
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, new-project]
  rule: >
    When exporting models for serving, package model weights alongside input/output signatures and environment specifications.
  rationale: >
    Prevents serving crashes caused by mismatched library versions or unexpected input tensor shapes.
  good: |
    mlflow.pytorch.log_model(model, "model", signature=signature)
  bad: |
    torch.save(model, "model.pth")
  verify:
    type: checklist
    prompt: Confirm model export includes input/output signatures and environment specifications.
  tags: [ml, model-serving, mlops]
  since: "0.1.0"

- id: ML-VER-001
  title: Pin exact versions of core ML dependencies and CUDA drivers
  layer: python-ml
  category: ops
  severity: high
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, new-project]
  rule: >
    Pin exact versions for PyTorch, CUDA, TensorFlow, and GPU drivers in lockfiles or Docker containers.
  rationale: >
    Minor version differences in ML packages frequently introduce breaking numerical or API changes.
  good: |
    torch==2.3.0+cu121
  bad: |
    torch>=2.0
  verify:
    type: checklist
    prompt: Confirm ML framework dependencies have pinned exact versions.
  tags: [ml, dependencies, reproducibility]
  since: "0.1.0"

- id: ML-TEST-001
  title: Write deterministic unit tests for custom layers, losses, and transforms
  layer: python-ml
  category: testing
  severity: high
  tier: standard
  applies_when:
    layers: [python-ml]
    tasks: [feature, testing]
  rule: >
    Test custom PyTorch/TensorFlow modules using synthetic tensors with known inputs and expected analytic outputs.
  rationale: >
    Catch mathematical errors, gradient vanishing, or dimensional bugs early in unit tests.
  good: |
    def test_custom_loss():
        pred = torch.tensor([1.0, 0.0])
        target = torch.tensor([1.0, 0.0])
        assert custom_loss(pred, target).item() == 0.0
  bad: |
    # Leaving custom layers untested until end-to-end training runs
  verify:
    type: checklist
    prompt: Confirm custom loss functions and layers have unit tests with synthetic inputs.
  tags: [ml, testing, unit-tests]
  since: "0.1.0"
