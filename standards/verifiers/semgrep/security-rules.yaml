# NOTE: Catches direct single-step unsafe SQL query construction passed to execute().
# Limitation: Does not catch two-step queries (query built on one line, executed on another);
# that needs Semgrep taint mode and is planned for v0.2.
rules:
  - id: sec-sql-string-concat
    patterns:
      - pattern-either:
          - pattern: $DB.execute($A + $B, ...)
          - pattern: $DB.execute(f"...{$VAR}...", ...)
          - pattern: $DB.execute("...".format(...), ...)
          - pattern: $DB.execute("..." % $VAR, ...)
      - pattern-not: $DB.execute("..." + "...", ...)
      - metavariable-regex:
          metavariable: $DB
          regex: '(?i).*(cursor|conn|connection|db|session|engine).*'
    message: "SQL query constructed via string concatenation or f-string formatting. Use parameterized query bindings."
    languages: [python]
    severity: ERROR
