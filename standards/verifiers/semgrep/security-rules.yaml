rules:
  - id: sec-sql-string-concat
    languages: [python]
    severity: ERROR
    message: >-
      SQL query built from string concatenation or formatting. Use
      parameterized query bindings instead.
    patterns:
      - pattern-either:
          - pattern: $DB.execute($A + $B, ...)
          - pattern: $DB.execute(f"...{$VAR}...", ...)
          - pattern: $DB.execute("...".format(...), ...)
          - pattern: $DB.execute("..." % $X, ...)
      - pattern-not: $DB.execute("..." + "...", ...)